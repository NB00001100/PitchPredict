# Weekly data refresh: fixtures/results, training data, forecasts, backfills.
# See docs/OPERATIONS.md. Note: GitHub disables scheduled workflows in a repository
# with no activity for 60 days; re-enable it from the Actions tab if that happens.
name: Refresh data

on:
  schedule:
    # Tuesdays: weekend results are in and football-data.co.uk has usually caught up.
    # Fridays: forecasts are fresh before the weekend; midweek results are captured.
    - cron: "0 8 * * 2,5"   # 08:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no writes to Supabase)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: refresh-data
  cancel-in-progress: false   # let a running refresh finish; the next one waits

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run refresh
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          PYTHONUNBUFFERED: "1"
        # refresh.py appends its summary to $GITHUB_STEP_SUMMARY itself.
        run: python refresh.py $DRY_RUN
